<style>
/* ---------- tokens: complete light palette on bare :root ---------- */
:root{
  --paper:#F4F6F7;
  --card:#FFFFFF;
  --ink:#0F1A20;
  --muted:#5B6B74;
  --faint:#8C9AA1;
  --line:#DBE1E4;
  --hair:#EBEFF1;
  --scarce:#A61B2B;
  --value:#0A6C63;
  --panel:#EFF2F3;
  --shadow:0 1px 2px rgba(15,26,32,.05), 0 12px 32px -18px rgba(15,26,32,.28);
  --sans:"IBM Plex Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:Archivo,"IBM Plex Sans","Noto Sans SC",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1216; --card:#131C21; --ink:#E7EDEF; --muted:#9BABB3; --faint:#6F818A;
    --line:#26333A; --hair:#1C272D; --scarce:#EE7A80; --value:#5CC9B8; --panel:#18232A;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 36px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1216; --card:#131C21; --ink:#E7EDEF; --muted:#9BABB3; --faint:#6F818A;
  --line:#26333A; --hair:#1C272D; --scarce:#EE7A80; --value:#5CC9B8; --panel:#18232A;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 36px -20px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.55;margin:0;
  padding:clamp(16px,3.4vw,48px) clamp(12px,3vw,32px) 96px;
  -webkit-font-smoothing:antialiased;
}
.deck{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(18px,2.6vw,34px)}

/* ---------- language + theme controls ---------- */
.controls{
  position:sticky;top:10px;z-index:20;align-self:flex-end;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
}
.seg{
  display:flex;align-items:stretch;
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  box-shadow:var(--shadow);overflow:hidden;
}
.seg button{
  font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;
  color:var(--muted);background:none;border:0;border-right:1px solid var(--line);
  padding:7px 13px 6px;cursor:pointer;line-height:1.4;
  border-bottom:2px solid transparent;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--scarce)}
.seg button:focus-visible{outline:2px solid var(--scarce);outline-offset:-2px}

/* ---------- slide shell ---------- */
.slide{
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--shadow);
  padding:clamp(26px,3.6vw,52px) clamp(22px,3.6vw,54px) clamp(30px,3.6vw,52px);
  position:relative;display:flex;flex-direction:column;aspect-ratio:16/9;
}
@media (max-width:820px){.slide{aspect-ratio:auto}}
.slide::after{
  content:attr(data-n);position:absolute;
  right:clamp(18px,2.4vw,30px);bottom:clamp(14px,1.8vw,22px);
  font-family:var(--mono);font-size:11px;color:var(--faint);
}
.nocaps{text-transform:none}
.eyebrow{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--scarce);margin:0 0 10px;
}
h2{
  font-family:var(--display);font-weight:800;
  font-size:clamp(22px,2.7vw,33px);line-height:1.16;letter-spacing:-.017em;
  text-wrap:balance;margin:0 0 clamp(16px,2vw,22px);
}
h2::after{content:"";display:block;height:1px;background:var(--line);margin-top:clamp(14px,1.8vw,20px)}
.cols{display:grid;gap:clamp(20px,3vw,42px);align-items:start}
.slide > .cols.a,.slide > .cols.b,.slide > .cols.c{flex:1;align-content:center}
.cols.a{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
.cols.b{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.cols.c{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,20px)}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)!important}}

/* ---------- text ---------- */
p{margin:0 0 .85em;max-width:64ch}
p:last-child{margin-bottom:0}
.lead{font-size:clamp(15px,1.35vw,17px);color:var(--ink)}
.gloss{font-size:13.5px;line-height:1.62;color:var(--muted);max-width:70ch}
ul.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7em}
ul.facts li{position:relative;padding-left:1.15em;font-size:16.5px}
ul.facts li::before{content:"";position:absolute;left:0;top:.58em;width:5px;height:5px;background:var(--scarce)}
strong{font-weight:600}
.neg{color:var(--scarce);font-weight:600}
.pos{color:var(--value);font-weight:600}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:0 0 clamp(14px,1.8vw,20px)}
table{
  border-collapse:collapse;width:100%;min-width:440px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:inherit;
}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--sans);white-space:nowrap;padding-left:0}
thead th{
  font-weight:600;font-size:11px;letter-spacing:.055em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:8px;
}
thead tr:first-child th:first-child{border-bottom:none}
thead th.grp{
  font-family:var(--sans);text-transform:none;letter-spacing:0;
  font-size:12.5px;color:var(--ink);text-align:center;border-bottom:1px solid var(--line);
}
tbody td{border-bottom:1px solid var(--hair)}
tr.rule td{border-bottom:1px solid var(--line)}
tr.sum td{border-top:1px solid var(--ink);border-bottom:none;font-weight:600;padding-top:9px}
tr.bat td{color:var(--value)}
td.gap,th.gap{padding-left:26px}
caption{caption-side:bottom;text-align:left;padding-top:12px;font:400 12.5px/1.6 var(--sans);color:var(--muted)}

/* ---------- panels ---------- */
.panel{background:var(--panel);border-radius:2px;padding:clamp(16px,1.9vw,22px)}
.panel h3{font-family:var(--sans);font-size:14px;font-weight:600;margin:0 0 .7em}
.panel + .panel{margin-top:14px}
.panel .gloss{font-size:13px}
.thesis{border-top:2px solid var(--scarce);padding-top:calc(clamp(16px,1.9vw,22px) - 2px)}
.eqs{
  display:grid;grid-template-columns:auto auto auto;justify-content:start;
  gap:.55em 1.7em;align-items:baseline;font-family:var(--mono);font-size:15px;
  margin-bottom:clamp(20px,2.4vw,30px);
}
.eqs sub{font-size:.7em}
.pbody{font-size:15px}
ul.pfacts li{font-size:15px}
.model{font-family:var(--mono);font-size:13.5px;line-height:1.5}
.model .obj{display:block;margin-bottom:.85em}
.model .sub{font-family:var(--sans);font-size:12px;color:var(--muted);display:block;margin-bottom:.5em}
.model .row{display:flex;justify-content:space-between;gap:14px;padding:.28em 0}
.model .dual{color:var(--scarce);font-weight:500}
.stat{background:var(--panel);border-radius:2px;padding:16px 18px;text-align:center}
.stat .k{font-family:var(--sans);font-size:12px;color:var(--muted);display:block;margin-bottom:.45em}
.stat .v{font-family:var(--mono);font-size:clamp(15px,1.7vw,19px);font-weight:500;display:block}
.stat .d{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--value);display:block;margin-top:.3em}

/* ---------- cover ---------- */
.cover{padding-top:clamp(44px,6vw,88px);padding-bottom:clamp(44px,6vw,88px)}
.cover .bar{width:56px;height:3px;background:var(--scarce);margin-bottom:clamp(22px,3vw,34px)}
.cover h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(32px,5.1vw,60px);line-height:1.03;letter-spacing:-.028em;
  margin:0 0 .28em;text-wrap:balance;
}
.cover .sub{font-size:clamp(16px,1.9vw,22px);color:var(--muted);margin:0 0 clamp(24px,3vw,36px);font-weight:400}
.cover .stand{max-width:56ch;font-size:clamp(14px,1.35vw,16px)}
.cover .by{margin-top:auto;padding-top:clamp(28px,3.6vw,46px);font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.045em}

/* ---------- figure ---------- */
svg.fig{width:100%;height:auto;display:block}
.fig .ax{stroke:var(--line);stroke-width:1;fill:none}
.fig .dem{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:square}
.fig .ramp{stroke:var(--scarce);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.fig .brk{stroke:var(--scarce);stroke-width:1.4;fill:none}
.fig .arw{stroke:var(--faint);stroke-width:1.4;fill:none}
.fig text{font-family:var(--sans);fill:var(--muted);font-size:11px}
.fig text.big{fill:var(--ink);font-weight:600;font-size:12.5px}
.fig text.acc{fill:var(--scarce)}
.fig text.accb{fill:var(--scarce);font-weight:600;font-size:12.5px}
.fig text.tick{fill:var(--faint);font-size:10px;font-family:var(--mono)}

/* ---------- CJK adjustments ---------- */
:root[data-lang="zh"] body{line-height:1.75}
:root[data-lang="zh"] .eyebrow{letter-spacing:.06em}
:root[data-lang="zh"] h2{letter-spacing:0;font-size:clamp(21px,2.5vw,30px);font-weight:700}
:root[data-lang="zh"] .cover h1{letter-spacing:0;font-weight:700;font-size:clamp(30px,4.6vw,54px)}
:root[data-lang="zh"] thead th{letter-spacing:.02em}
:root[data-lang="zh"] .gloss,:root[data-lang="zh"] caption{line-height:1.72}
:root[data-lang="zh"] caption{padding-top:10px}
:root[data-lang="zh"] .stat{padding:12px 16px}
:root[data-lang="zh"] .stat .k{margin-bottom:.3em}
:root[data-lang="zh"] th,:root[data-lang="zh"] td{padding-top:6px;padding-bottom:6px}

@media print{
  /* impressao sempre na paleta clara, mesmo com o leitor em modo escuro */
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"]{
    --paper:#FFFFFF; --card:#FFFFFF; --ink:#0F1A20; --muted:#5B6B74; --faint:#8C9AA1;
    --line:#DBE1E4; --hair:#EBEFF1; --scarce:#A61B2B; --value:#0A6C63; --panel:#EFF2F3;
    --shadow:none;
  }
  body{background:#fff;padding:0;color:var(--ink)}
  .deck{gap:0;max-width:none}
  .controls{display:none}
  .slide{border:none;box-shadow:none;border-radius:0;page-break-after:always;min-height:100vh;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* ---------- Caso Brasil: controles e indicadores ---------- */
.ctl{background:var(--panel);border-radius:2px;padding:9px 13px}

  font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:.25em}

.ctl input[type=range]{width:100%;accent-color:var(--scarce);margin:0;cursor:pointer}
.ctl input[type=range]:focus-visible{outline:2px solid var(--scarce);outline-offset:3px}

  background:var(--line);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.ind > div{background:var(--card);padding:7px 9px}

.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:.6em;

.legend > span{display:flex;align-items:center;gap:5px}

.legend .sw.hyd{background:var(--value);opacity:.30}

.legend .sw.bar{background:var(--scarce);opacity:.35;height:10px;width:8px}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;

.dayfig .mcbar{fill:var(--scarce);opacity:.17}

.dayfig .vt{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.dayfig .dot{fill:var(--card);stroke:var(--ink);stroke-width:2}
#s8 table{min-width:0;font-size:13px}
#s9 table.rev{min-width:0;font-size:11px}
#s9 table.rev th{font-size:8.5px;letter-spacing:.03em;padding-bottom:4px}

#s9 table.rev th.unit{font-size:8.5px;color:var(--faint);text-align:left;border-bottom:none}
#s9 table.rev th,#s9 table.rev td{padding:2.5px 4px;white-space:nowrap;line-height:1.35}
#s9 table.rev td:first-child{font-size:10.5px}
#s9 table.rev td.gap,#s9 table.rev th.gap{padding-left:12px}
#s9 #brCap{font-size:10.5px;line-height:1.45}
#s8 td:first-child{white-space:normal}
#s8 th,#s8 td{padding:5.5px 7px}
#s8 .gloss{font-size:12px;line-height:1.55}
#s9 .gloss{font-size:11.5px;line-height:1.5}
#s9 .legend{font-size:10.5px;gap:3px 12px}
#s8 .panel,#s9 .panel{padding:13px 15px}
#s8 .pbody,#s9 .pbody{font-size:13px;line-height:1.5}
#s9 .panel{padding:14px 16px}
#s9 .pbody{font-size:14px}
.stackfig .band{stroke:none}
.stackfig .fix{fill:var(--faint);opacity:.42}
.stackfig .hyd{fill:var(--value);opacity:.28}
.stackfig .thm{fill:var(--scarce);opacity:.26}
.stackfig .chip{fill:var(--scarce)}
.stackfig text.chipt{fill:#fff;font-family:var(--mono);font-size:10px;font-weight:600}
.stackfig .edge{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.stackfig .dem{stroke:var(--ink);stroke-width:1.3;stroke-dasharray:4 3;fill:none}
.stackfig .plv{stroke:var(--scarce);stroke-width:1.6;fill:none}
.stackfig text{font-family:var(--sans);fill:var(--muted);font-size:10.5px}
.stackfig text.b{fill:var(--ink);font-weight:600;font-size:11px}
.stackfig text.p{fill:var(--scarce);font-weight:600;font-size:11px;font-family:var(--mono)}
:root[data-lang="zh"] .ind .k{font-size:10px}
@media (max-width:820px){.ind{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

// ---- solver de duas horas, espelho do modelo validado em Python ----
const BRcum = (function(){
  let mw=[0], cost=[0], cvu=[];
  for (const [c,m] of BR.stack){ cvu.push(c); mw.push(mw[mw.length-1]+m); cost.push(cost[cost.length-1]+m*c); }
  return {mw, cost, cvu, total: mw[mw.length-1]};
})();
const R1 = BR.d1 - BR.HFIX, R2 = BR.d2 - BR.HFIX;
function thCost(q){
  if (q <= 0) return 0;
  if (q > BRcum.total + 1e-6) return Infinity;
  let lo=0, hi=BRcum.cvu.length-1;
  while (lo < hi){ const mid=(lo+hi)>>1; if (BRcum.mw[mid+1] < q) lo=mid+1; else hi=mid; }
  return BRcum.cost[lo] + (q - BRcum.mw[lo]) * BRcum.cvu[lo];
}
function runFixed(rho, e, r1, r2){
  const R = rho/100 * BR.HFLEX * BR.dt;
  const top = Math.min(r1 + e, BR.HFLEX);
  const cand = [0, top];
  for (let i=1; i<BRcum.mw.length; i++){ cand.push(r1 + e - BRcum.mw[i]); cand.push(r2 - e - BRcum.mw[i] - R); }
  for (let i=0; i<=40; i++) cand.push(top*i/40);
  let best = Infinity;
  for (const h1 of cand){
    if (h1 < 0 || h1 > top) continue;
    const h2 = Math.min(h1 + R, r2 - e, BR.HFLEX);
    if (h2 < 0) continue;
    const t1 = r1 + e - h1, t2 = r2 - e - h2;
    if (t1 < -1e-6 || t2 < -1e-6) continue;
    const c1 = thCost(Math.max(t1,0)), c2 = thCost(Math.max(t2,0));
    if (!isFinite(c1) || !isFinite(c2)) continue;
    const v = c1 + BR.W*h1 + c2 + BR.W*h2;      // dois blocos de uma hora
    if (v < best) best = v;
  }
  return best;
}
function solve(rho, E, r1, r2){
  r1 = r1===undefined ? R1 : r1;  r2 = r2===undefined ? R2 : r2;
  let best = Infinity, eBest = 0;
  for (let i=0; i<=60; i++){
    const e = E*i/60, v = runFixed(rho, e, r1, r2);
    if (v < best){ best = v; eBest = e; }
  }
  return {cost: best, e: eBest};
}
function prices(rho, E){
  const d = 10, base = solve(rho, E);
  if (!isFinite(base.cost)) return {cost:Infinity, e:0, p1:NaN, p2:NaN, spread:NaN};
  const p1 = (solve(rho, E, R1 + d, R2).cost - base.cost)/d;
  const p2 = (solve(rho, E, R1, R2 + d).cost - base.cost)/d;
  return {cost: base.cost, e: base.e, p1, p2, spread: p2 - p1};
}

// despacho otimo detalhado, para montar a liquidacao por agente
function dispatchAt(rho, e){
  const R = rho/100 * BR.HFLEX * BR.dt;
  const top = Math.min(R1 + e, BR.HFLEX);
  const cand = [0, top];
  for (let i=1; i<BRcum.mw.length; i++){ cand.push(R1 + e - BRcum.mw[i]); cand.push(R2 - e - BRcum.mw[i] - R); }
  for (let i=0; i<=40; i++) cand.push(top*i/40);
  let best = Infinity, arg = null;
  for (const h1 of cand){
    if (h1 < 0 || h1 > top) continue;
    const h2 = Math.min(h1 + R, R2 - e, BR.HFLEX);
    if (h2 < 0) continue;
    const t1 = R1 + e - h1, t2 = R2 - e - h2;
    if (t1 < -1e-6 || t2 < -1e-6) continue;
    const c1 = thCost(Math.max(t1,0)), c2 = thCost(Math.max(t2,0));
    if (!isFinite(c1) || !isFinite(c2)) continue;
    const v = c1 + BR.W*h1 + c2 + BR.W*h2;
    if (v < best){ best = v; arg = {h1, h2, t1:Math.max(t1,0), t2:Math.max(t2,0), c1, c2, e}; }
  }
  return arg;
}

// liquidacao por agente, no formato do exemplo didatico
function settle(rho, E){
  const pr = prices(rho, E);
  const d  = dispatchAt(rho, pr.e);
  if (!d || !isFinite(pr.p1)) return null;
  const p1 = pr.p1, p2 = pr.p2, e = pr.e;
  const row = (q1, q2, cost) => ({q1, q2, rec: p1*q1 + p2*q2, cost, luc: p1*q1 + p2*q2 - cost});
  const ag = {
    fix: row(BR.HFIX, BR.HFIX, 0),                    // fio d'agua: agua sem uso alternativo
    flex: row(d.h1, d.h2, BR.W*(d.h1 + d.h2)),
    term: row(d.t1, d.t2, d.c1 + d.c2),
    bat:  row(-e, e, 0),
  };
  const pago = p1*BR.d1 + p2*BR.d2;
  ag.dem = {q1: BR.d1, q2: BR.d2, rec: -pago, cost: null, luc: null};
  ag.soma = {
    rec:  ag.fix.rec + ag.flex.rec + ag.term.rec + ag.bat.rec - pago,   // adequacao de receita
    cost: ag.fix.cost + ag.flex.cost + ag.term.cost,
    luc:  ag.fix.luc + ag.flex.luc + ag.term.luc + ag.bat.luc,
  };
  return {p1, p2, e, ag};
}

  document.getElementById('d1Marks').innerHTML = mk.join('');
}

// ================= Slide 9: pilha de ordem de merito =================
const PX = {l:52, r:568, t:12, b:172};
const YMAX = 1400;
const BRORD = (function(){
  const u = BR.stack.map(([c,m]) => ({c, m, kind:'thm'}));
  u.push({c: BR.W, m: BR.HFLEX, kind:'hyd'});
  u.sort((a,b) => a.c - b.c);
  u.unshift({c: 0, m: BR.HFIX, kind:'fix'});      // inflexivel: roda sempre, entra na base
  return u;
})();
const BRTOT = BRORD.reduce((s,u) => s + u.m, 0);
const X = mw => PX.l + (mw / BRTOT) * (PX.r - PX.l);
const Y = p  => PX.b - Math.min(Math.max(p,0), YMAX) / YMAX * (PX.b - PX.t);

function drawStack(){
  const ax=[], st=[];
  ax.push(`<line x1="${PX.l}" y1="${PX.t}" x2="${PX.l}" y2="${PX.b}" stroke="var(--line)"/>`);
  ax.push(`<line x1="${PX.l}" y1="${PX.b}" x2="${PX.r}" y2="${PX.b}" stroke="var(--line)"/>`);
  for (const p of [0,350,700,1050,1400]){
    ax.push(`<line x1="${PX.l-4}" y1="${Y(p)}" x2="${PX.l}" y2="${Y(p)}" stroke="var(--line)"/>`);
    ax.push(`<text x="${PX.l-7}" y="${Y(p)+3.5}" text-anchor="end">${p}</text>`);
  }
  ax.push(`<text x="${PX.r}" y="${PX.t-1}" text-anchor="end">R$/MWh</text>`);
  for (let g=0; g<=100; g+=25){
    ax.push(`<line x1="${X(g*1000)}" y1="${PX.b}" x2="${X(g*1000)}" y2="${PX.b+4}" stroke="var(--line)"/>`);
    ax.push(`<text x="${X(g*1000)}" y="${PX.b+15}" text-anchor="middle">${g}</text>`);
  }
  ax.push(`<text x="${PX.r}" y="${PX.b+28}" text-anchor="end" data-t="b2.axx"></text>`);
  let acc = 0, path = `M ${X(0)} ${Y(0)}`;
  for (const u of BRORD){
    const x0 = X(acc), x1 = X(acc + u.m);
    const y = (u.kind === 'fix') ? PX.b - 8 : Y(u.c);       // faixa minima visivel para o piso
    st.push(`<rect class="band ${u.kind}" x="${x0}" y="${y}" width="${Math.max(x1-x0,0.4)}" height="${PX.b-y}"/>`);
    path += ` L ${x0} ${y} L ${x1} ${y}`;
    acc += u.m;
  }
  st.push(`<path class="edge" d="${path}"/>`);
  document.getElementById('brAxis').innerHTML = ax.join('');
  document.getElementById('brStack').innerHTML = st.join('');
}

function updateBR(){
  const rho = parseFloat(document.getElementById('brRho').value);
  const E   = parseFloat(document.getElementById('brE').value);
  const lang = document.documentElement.getAttribute('data-lang') || 'en';
  const nf  = new Intl.NumberFormat(LOC[lang], {maximumFractionDigits:0, useGrouping:'always'});
  const nf1 = new Intl.NumberFormat(LOC[lang], {minimumFractionDigits:1, maximumFractionDigits:1});
  const nf2 = new Intl.NumberFormat(LOC[lang], {minimumFractionDigits:2, maximumFractionDigits:2});
  const sg  = function(v){                       // arredonda antes do sinal, para nao imprimir "−0"
    if (!isFinite(v)) return '—';
    const n = Math.round(v);
    return (n < 0 ? '−' : '') + nf.format(Math.abs(n));
  };

  document.getElementById('brRhoV').textContent = nf1.format(rho) + '%/h';
  document.getElementById('brEV').textContent   = nf.format(E) + ' MWh';

  const r = prices(rho, E);
  // liquidacao por agente, sem e com bateria, no formato do exemplo didatico
  const MI = function(v){                        // R$ milhoes, com sinal de menos tipografico
    if (v === null || !isFinite(v)) return '';
    const x = v/1e6;
    if (Math.abs(x) < 0.005) return nf1.format(0);   // abaixo de R$ 5 mil, e zero
    const s = (Math.abs(x) < 0.05) ? nf2.format(Math.abs(x)) : nf1.format(Math.abs(x));
    return (x < 0 ? MINUS : '') + s;
  };
  const s0 = settle(rho, 0), s1 = settle(rho, E);
  const put = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = MI(v); };
  for (const [k, name] of [['fix','fix'],['flex','flex'],['term','term']]){
    put('a_'+name+'_r0', s0 && s0.ag[k].rec);  put('a_'+name+'_c0', s0 && s0.ag[k].cost);  put('a_'+name+'_l0', s0 && s0.ag[k].luc);
    put('a_'+name+'_r1', s1 && s1.ag[k].rec);  put('a_'+name+'_c1', s1 && s1.ag[k].cost);  put('a_'+name+'_l1', s1 && s1.ag[k].luc);
  }
  put('a_bat_r1', s1 && s1.ag.bat.rec);  put('a_bat_c1', s1 && s1.ag.bat.cost);  put('a_bat_l1', s1 && s1.ag.bat.luc);
  put('a_dem_r0', s0 && s0.ag.dem.rec);  put('a_dem_r1', s1 && s1.ag.dem.rec);
  for (const [sfx, s] of [['0', s0], ['1', s1]]){
    put('a_soma_r'+sfx, s && s.ag.soma.rec);
    put('a_soma_c'+sfx, s && s.ag.soma.cost);
    put('a_soma_l'+sfx, s && s.ag.soma.luc);
  }
  // os precos de cada caso vao no cabecalho do proprio grupo
  const D = DICT[lang];
  if (s0) document.getElementById('grp0').textContent = D['b2.g0'] + ' · ' + sg(s0.p1) + ' → ' + sg(s0.p2);
  if (s1) document.getElementById('grp1').textContent = D['b2.g1b'] + ' · ' + sg(s1.p1) + ' → ' + sg(s1.p2);

  const m = [];
  for (const [d, key] of [[BR.d1,'b2.lt1'], [BR.d2,'b2.lt2']]){
    const x = X(d);
    m.push(`<line class="dem" x1="${x}" y1="${PX.t}" x2="${x}" y2="${PX.b}"/>`);
    const an = (d === BR.d1) ? 'start' : 'end', dx = (d === BR.d1) ? 5 : -5;
    m.push(`<text class="b" x="${x+dx}" y="${PX.t+11}" text-anchor="${an}" data-t="${key}"></text>`);
    m.push(`<text class="p" x="${x+dx}" y="${PX.t+24}" text-anchor="${an}">${Math.round(d/1000)} GW</text>`);
  }
  const pts = [[r.p1,'t1'], [r.p2,'t2']].filter(p => isFinite(p[0]));
  const ys  = pts.map(p => Y(p[0]));
  const near = ys.length === 2 && Math.abs(ys[0]-ys[1]) < 14;
  pts.forEach(function(pair, i){
    const y = ys[i], dy = near ? (i === 0 ? 12 : -5) : -5;
    m.push(`<line class="plv" x1="${PX.l}" y1="${y}" x2="${PX.r}" y2="${y}"/>`);
    m.push(`<rect class="chip" x="${PX.l+3}" y="${y+dy-9}" width="86" height="13" rx="1"/>`);
    m.push(`<text class="chipt" x="${PX.l+7}" y="${y+dy}">${pair[1]} → ${sg(pair[0])}</text>`);
  });
  document.getElementById('brMarks').innerHTML = m.join('');
  applyI18n();
}

function initBR(){
  if (!document.getElementById('brRho')) return;
  drawDay(); drawStack();
  document.getElementById('brRho').addEventListener('input', updateBR);
  document.getElementById('brE').addEventListener('input', updateBR);
  updateBR();
}

const LOC   = {pt:"pt-BR", en:"en-US", es:"es-ES", zh:"zh-CN"};
const TAG   = {pt:"pt-BR", en:"en",    es:"es",    zh:"zh-CN"};
const MINUS = "−";
let CURLANG = "en";

function makeFmt(lang){
  // useGrouping:"always" mantem o separador nos numeros de quatro digitos, que o
  // espanhol descartaria (5000 em vez de 5.000) numa coluna que tambem tem 24.000.
  const nf = new Intl.NumberFormat(LOC[lang], {maximumFractionDigits:2, useGrouping:"always"});
  return function(v, plus){
    const s = nf.format(Math.abs(v)).replace(/-/g, MINUS);
    return v < 0 ? MINUS + s : (plus ? "+" + s : s);
  };
}

function applyI18n(){
  const d = DICT[CURLANG], fmt = makeFmt(CURLANG);
  document.querySelectorAll("[data-t]").forEach(function(el){
    const v = d[el.getAttribute("data-t")];
    if (v === undefined) return;
    if (/[<&]/.test(v)) { el.innerHTML = v; } else { el.textContent = v; }
  });
  document.querySelectorAll("[data-alt]").forEach(function(el){
    const v = d[el.getAttribute("data-alt")];
    if (v !== undefined) el.setAttribute("aria-label", v);
  });
  document.querySelectorAll("[data-v]").forEach(function(el){
    el.textContent = fmt(Number(el.getAttribute("data-v")), el.hasAttribute("data-plus"));
  });
}

function setLang(lang){
  if (!DICT[lang]) lang = "en";
  CURLANG = lang;
  document.documentElement.setAttribute("data-lang", lang);
  document.documentElement.lang = TAG[lang];
  applyI18n();
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
  if (typeof updateBR === "function" && document.getElementById("brRho")) updateBR();
  try { localStorage.setItem("deck-lang", lang); } catch (e) {}
}

function setTheme(mode){
  const root = document.documentElement;
  if (mode === "auto") { root.removeAttribute("data-theme"); }
  else { root.setAttribute("data-theme", mode); }
  document.querySelectorAll("[data-theme-set]").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.themeSet === mode));
  });
  try { localStorage.setItem("deck-theme", mode); } catch (e) {}
}

document.querySelectorAll("[data-lang]").forEach(function(b){
  b.addEventListener("click", function(){ setLang(b.dataset.lang); });
});
document.querySelectorAll("[data-theme-set]").forEach(function(b){
  b.addEventListener("click", function(){ setTheme(b.dataset.themeSet); });
});

var startLang = "en";
try { var sl = localStorage.getItem("deck-lang"); if (sl && DICT[sl]) startLang = sl; } catch (e) {}
var startTheme = "light";
try { var st = localStorage.getItem("deck-theme"); if (st === "dark" || st === "auto" || st === "light") startTheme = st; } catch (e) {}

setLang(startLang);
setTheme(startTheme);
initBR();
</script>
